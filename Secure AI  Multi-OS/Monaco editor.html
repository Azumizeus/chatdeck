<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SecureDev OS — IDE</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --bg-deep: #040810;
  --bg: #080e18;
  --bg-card: #0c1422;
  --bg-elevated: #101c2e;
  --bg-input: #060c16;
  --border: #14203a;
  --border-active: #00ff8844;
  --fg: #b8cce0;
  --fg-dim: #3a5272;
  --fg-bright: #e4eef8;
  --accent: #00ff88;
  --accent-dim: #00ff8815;
  --accent-mid: #00ff8833;
  --cyan: #00d4ff;
  --cyan-dim: #00d4ff15;
  --red: #ff3366;
  --orange: #ff8844;
  --yellow: #ffd700;
  --font-code: 'JetBrains Mono', monospace;
  --font-ui: 'Space Grotesk', sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; background:var(--bg-deep); color:var(--fg); font-family:var(--font-ui); }
::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--fg-dim); }

.bg-grid { position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 40px 40px; opacity: 0.15;
}
.bg-glow { position:fixed; width:500px; height:500px; border-radius:50%; background:radial-gradient(circle, var(--accent-dim), transparent 70%); top:-100px; left:-100px; z-index:0; pointer-events:none; }
.bg-glow-2 { position:fixed; width:400px; height:400px; border-radius:50%; background:radial-gradient(circle, var(--cyan-dim), transparent 70%); bottom:-100px; right:-100px; z-index:0; pointer-events:none; }

#app { position:relative; z-index:1; display:flex; flex-direction:column; height:100vh; }

/* --- TOPBAR --- */
.topbar { height:42px; min-height:42px; background:var(--bg); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 12px; gap:8px; }
.topbar-logo { width:26px; height:26px; border-radius:6px; background:linear-gradient(135deg, var(--accent), var(--cyan)); display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--bg-deep); font-weight:700; flex-shrink:0; }
.topbar-title { font-size:12px; font-weight:600; color:var(--fg-bright); margin-right:8px; }
.topbar-sep { width:1px; height:20px; background:var(--border); }
.tabs { display:flex; flex:1; overflow-x:auto; gap:2px; scrollbar-width:none; }
.tabs::-webkit-scrollbar { display:none; }
.tab { display:flex; align-items:center; gap:6px; padding:6px 12px; font-size:11px; font-family:var(--font-code); color:var(--fg-dim); border-radius:4px 4px 0 0; cursor:pointer; white-space:nowrap; border:1px solid transparent; border-bottom:none; transition:all 0.15s; flex-shrink:0; background:transparent; }
.tab:hover { color:var(--fg); background:var(--bg-elevated); }
.tab.active { color:var(--fg-bright); background:var(--bg-card); border-color:var(--border); }
.tab .dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
.tab .close { opacity:0; font-size:9px; padding:2px; border-radius:3px; transition:opacity 0.15s; cursor:pointer; }
.tab:hover .close { opacity:0.5; }
.tab .close:hover { opacity:1; background:var(--red); color:#fff; }
.topbar-actions { display:flex; gap:2px; flex-shrink:0; }
.tb-btn { width:32px; height:32px; border:none; border-radius:6px; background:transparent; color:var(--fg-dim); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:13px; transition:all 0.15s; }
.tb-btn:hover { background:var(--bg-elevated); color:var(--fg); }
.tb-btn.active { color:var(--accent); background:var(--accent-dim); }

/* --- MAIN LAYOUT --- */
.main { display:flex; flex:1; overflow:hidden; }

/* --- SIDEBAR --- */
.sidebar { width:240px; min-width:240px; background:var(--bg); border-right:1px solid var(--border); display:flex; flex-direction:column; transition:width 0.2s, min-width 0.2s, opacity 0.2s; overflow:hidden; }
.sidebar.collapsed { width:0; min-width:0; opacity:0; pointer-events:none; }
.sb-header { padding:10px 12px; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:var(--fg-dim); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
.sb-header button { background:none; border:none; color:var(--fg-dim); cursor:pointer; font-size:12px; }
.sb-header button:hover { color:var(--accent); }
.file-tree { flex:1; overflow-y:auto; padding:4px 0; }
.fi { display:flex; align-items:center; gap:6px; padding:3px 12px 3px; font-size:11.5px; font-family:var(--font-code); color:var(--fg-dim); cursor:pointer; transition:background 0.1s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fi:hover { background:var(--bg-elevated); color:var(--fg); }
.fi.active { background:var(--accent-dim); color:var(--accent); }
.fi .fi-icon { width:16px; text-align:center; font-size:10px; flex-shrink:0; }
.fi.folder > .fi-icon { color:var(--orange); }
.fi-children { display:none; }
.fi.folder.open > .fi-children { display:block; }

/* --- EDITOR AREA --- */
.editor-area { flex:1; display:flex; flex-direction:column; min-width:0; background:var(--bg-deep); }
#monaco-container { flex:1; overflow:hidden; }

/* --- TERMINAL --- */
.terminal { height:200px; min-height:40px; background:var(--bg); border-top:1px solid var(--border); display:flex; flex-direction:column; transition:height 0.2s; }
.terminal.collapsed { height:40px; min-height:40px; }
.term-header { height:36px; min-height:36px; display:flex; align-items:center; padding:0 12px; border-bottom:1px solid var(--border); cursor:pointer; }
.term-header span { font-size:11px; font-family:var(--font-code); color:var(--fg-dim); flex:1; }
.term-header i { color:var(--fg-dim); font-size:11px; transition:transform 0.2s; }
.term-header i.rotated { transform:rotate(180deg); }
.term-body { flex:1; overflow-y:auto; padding:8px 12px; font-family:var(--font-code); font-size:11.5px; line-height:1.7; }
.t-line { white-space:pre-wrap; word-break:break-all; }
.t-prompt { color:var(--accent); }
.t-path { color:var(--cyan); }
.t-cmd { color:var(--fg-bright); }
.t-out { color:var(--fg-dim); }
.t-err { color:var(--red); }
.t-ok { color:var(--accent); }
.t-warn { color:var(--yellow); }
.term-input-wrap { display:flex; align-items:center; padding:4px 12px 8px; border-top:1px solid var(--border); }
.term-input { flex:1; background:transparent; border:none; outline:none; font-family:var(--font-code); font-size:11.5px; color:var(--fg-bright); caret-color:var(--accent); }

/* --- AGENT PANEL --- */
.agent { width:340px; min-width:340px; background:var(--bg); border-left:1px solid var(--border); display:flex; flex-direction:column; transition:width 0.2s, min-width 0.2s, opacity 0.2s; overflow:hidden; }
.agent.collapsed { width:0; min-width:0; opacity:0; pointer-events:none; }
.ag-header { padding:12px; border-bottom:1px solid var(--border); display:flex; gap:10px; align-items:center; }
.ag-avatar { width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg, var(--accent), var(--cyan)); display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--bg-deep); flex-shrink:0; }
.ag-name { font-size:12px; font-weight:600; color:var(--fg-bright); }
.ag-status { font-size:10px; color:var(--accent); display:flex; align-items:center; gap:4px; }
.ag-status .pulse { width:5px; height:5px; border-radius:50%; background:var(--accent); animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }
.ag-tools { padding:6px 10px; border-bottom:1px solid var(--border); display:flex; gap:3px; overflow-x:auto; scrollbar-width:none; }
.ag-tools::-webkit-scrollbar { display:none; }
.ag-tool { padding:3px 8px; border-radius:4px; font-size:9.5px; font-family:var(--font-code); background:var(--bg-elevated); color:var(--fg-dim); border:1px solid var(--border); cursor:pointer; white-space:nowrap; transition:all 0.15s; }
.ag-tool:hover, .ag-tool.active { border-color:var(--cyan); color:var(--cyan); background:var(--cyan-dim); }
.ag-messages { flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:8px; }
.ag-msg { max-width:95%; padding:8px 12px; border-radius:8px; font-size:11.5px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
.ag-msg.user { align-self:flex-end; background:var(--accent-dim); border:1px solid var(--accent-mid); color:var(--fg-bright); }
.ag-msg.bot { align-self:flex-start; background:var(--bg-elevated); border:1px solid var(--border); color:var(--fg); }
.ag-msg.sys { align-self:center; color:var(--fg-dim); font-size:10px; font-family:var(--font-code); border:1px dashed var(--border); padding:4px 10px; }
.ag-tool-trace { margin-top:4px; padding:4px 8px; background:var(--bg-deep); border-radius:4px; font-size:9.5px; font-family:var(--font-code); color:var(--cyan); }
.ag-input-wrap { padding:8px 10px; border-top:1px solid var(--border); display:flex; gap:6px; align-items:flex-end; }
.ag-input { flex:1; background:var(--bg-input); border:1px solid var(--border); border-radius:6px; padding:8px 10px; font-size:11.5px; font-family:var(--font-ui); color:var(--fg-bright); outline:none; resize:none; min-height:36px; max-height:100px; }
.ag-input:focus { border-color:var(--cyan); }
.ag-send { width:36px; height:36px; border-radius:6px; background:linear-gradient(135deg, var(--accent), var(--cyan)); border:none; color:var(--bg-deep); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; transition:transform 0.1s; }
.ag-send:active { transform:scale(0.9); }

/* --- MODAL --- */
.modal-bg { position:fixed; inset:0; z-index:500; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; padding:20px; }
.modal-bg.show { display:flex; }
.modal { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:20px; width:100%; max-width:400px; animation:modIn 0.2s; }
@keyframes modIn { from{opacity:0;transform:translateY(10px)} }
.modal h3 { font-size:15px; font-weight:600; color:var(--fg-bright); margin-bottom:14px; }
.modal label { display:block; font-size:10px; font-family:var(--font-code); color:var(--fg-dim); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px; }
.modal input, .modal select { width:100%; background:var(--bg-input); border:1px solid var(--border); border-radius:6px; padding:8px 10px; font-size:12px; font-family:var(--font-code); color:var(--fg-bright); outline:none; margin-bottom:12px; }
.modal input:focus, .modal select:focus { border-color:var(--accent); }
.modal-btns { display:flex; gap:8px; justify-content:flex-end; margin-top:4px; }
.m-btn { padding:7px 16px; border-radius:6px; border:1px solid var(--border); background:var(--bg-elevated); color:var(--fg); font-size:11.5px; cursor:pointer; transition:all 0.15s; font-family:var(--font-ui); }
.m-btn:hover { background:var(--border); }
.m-btn.primary { background:var(--accent); color:var(--bg-deep); border-color:var(--accent); font-weight:600; }

/* --- TOAST --- */
.toast-box { position:fixed; top:52px; right:16px; z-index:600; display:flex; flex-direction:column; gap:6px; }
.toast { padding:8px 14px; border-radius:6px; background:var(--bg-elevated); border:1px solid var(--border); font-size:11px; color:var(--fg); display:flex; align-items:center; gap:8px; box-shadow:0 4px 20px rgba(0,0,0,0.5); animation:tIn 0.2s; }
.toast i { color:var(--accent); }
.toast.err i { color:var(--red); }
@keyframes tIn { from{opacity:0;transform:translateX(10px)} }

@media (max-width:800px) {
  .sidebar { position:fixed; left:0; top:42px; bottom:0; z-index:100; width:260px !important; min-width:260px !important; box-shadow:8px 0 24px rgba(0,0,0,0.6); }
  .sidebar.collapsed { transform:translateX(-100%); }
  .agent { position:fixed; right:0; top:42px; bottom:0; z-index:100; width:100% !important; min-width:100% !important; max-width:360px; box-shadow:-8px 0 24px rgba(0,0,0,0.6); }
  .agent.collapsed { transform:translateX(100%); }
}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="bg-glow-2"></div>

<div id="app">
  <div class="topbar">
    <div class="topbar-logo"><i class="fas fa-shield-halved"></i></div>
    <div class="topbar-title">SecureDev</div>
    <div class="topbar-sep"></div>
    <div class="tabs" id="tabs"></div>
    <div class="topbar-actions">
      <button class="tb-btn active" id="btn-sb" onclick="toggle('sb')" title="Fichiers"><i class="fas fa-folder-tree"></i></button>
      <button class="tb-btn active" id="btn-term" onclick="toggle('term')" title="Terminal"><i class="fas fa-terminal"></i></button>
      <button class="tb-btn active" id="btn-ag" onclick="toggle('ag')" title="Agent IA"><i class="fas fa-robot"></i></button>
      <button class="tb-btn" onclick="showModal()" title="Nouveau fichier"><i class="fas fa-plus"></i></button>
      <button class="tb-btn" onclick="saveCurrentFile()" title="Sauvegarder (Ctrl+S)"><i class="fas fa-floppy-disk"></i></button>
    </div>
  </div>

  <div class="main">
    <div class="sidebar" id="sb">
      <div class="sb-header">EXPLORATEUR <button onclick="showModal()" title="Nouveau fichier"><i class="fas fa-plus"></i></button></div>
      <div class="file-tree" id="file-tree"></div>
    </div>

    <div class="editor-area">
      <div id="monaco-container"></div>
      <div class="terminal" id="term">
        <div class="term-header" onclick="toggle('term')">
          <span>TERMINAL</span>
          <i class="fas fa-chevron-down" id="term-chev"></i>
        </div>
        <div class="term-body" id="term-body"></div>
        <div class="term-input-wrap">
          <span class="t-prompt" style="margin-right:6px">~/project $</span>
          <input class="term-input" id="term-in" autocomplete="off" spellcheck="false">
        </div>
      </div>
    </div>

    <div class="agent" id="ag">
      <div class="ag-header">
        <div class="ag-avatar"><i class="fas fa-robot"></i></div>
        <div>
          <div class="ag-name">Agent SecureDev</div>
          <div class="ag-status"><div class="pulse"></div>Prêt</div>
        </div>
      </div>
      <div class="ag-tools">
        <button class="ag-tool" data-t="gen" onclick="setTool(this)">Générer</button>
        <button class="ag-tool" data-t="fix" onclick="setTool(this)">Corriger</button>
        <button class="ag-tool" data-t="review" onclick="setTool(this)">Review</button>
        <button class="ag-tool" data-t="explain" onclick="setTool(this)">Expliquer</button>
        <button class="ag-tool" data-t="test" onclick="setTool(this)">Tester</button>
        <button class="ag-tool" data-t="refactor" onclick="setTool(this)">Refactor</button>
      </div>
      <div class="ag-messages" id="ag-msgs">
        <div class="ag-msg sys">Agent local connecté — 6 outils actifs</div>
        <div class="ag-msg bot">Je peux lire votre code, générer des fonctions, corriger des erreurs, et exécuter des commandes. Décrivez ce dont vous avez besoin ou sélectionnez un outil.</div>
      </div>
      <div class="ag-input-wrap">
        <textarea class="ag-input" id="ag-in" placeholder="Décrire la tâche..." rows="1"></textarea>
        <button class="ag-send" onclick="sendAg()"><i class="fas fa-arrow-up"></i></button>
      </div>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3>Nouveau fichier</h3>
    <label>Chemin</label>
    <input id="nf-path" placeholder="src/utils/math.js">
    <label>Template</label>
    <select id="nf-tpl">
      <option value="">Vide</option>
      <option value="js">JavaScript</option>
      <option value="html">HTML</option>
      <option value="css">CSS</option>
      <option value="py">Python</option>
      <option value="json">JSON</option>
    </select>
    <div class="modal-btns">
      <button class="m-btn" onclick="hideModal()">Annuler</button>
      <button class="m-btn primary" onclick="createFile()">Créer</button>
    </div>
  </div>
</div>

<div class="toast-box" id="toasts"></div>

<!-- MONACO EDITOR -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
<script>
/* =============================================
   SecureDev OS — Vrai IDE dans le navigateur
   ============================================= */

// --- État global ---
const S = {
  files: {},
  tabs: [],
  active: null,
  models: {},
  tool: null,
  history: [],
  histIdx: -1
};

// --- Système de fichiers initial ---
S.files = {
  'src/main.js': `import express from 'express';\nimport { add, multiply } from './math.js';\n\nconst app = express();\nconst PORT = 3000;\n\napp.use(express.json());\n\napp.get('/', (req, res) => {\n  res.json({\n    result: add(10, 20),\n    product: multiply(5, 6),\n    status: 'ok'\n  });\n});\n\napp.listen(PORT, () => {\n  console.log(\`Serveur démarré sur le port \${PORT}\`);\n});\n`,
  'src/math.js': `// Fonctions mathématiques\n\nexport function add(a, b) {\n  return a + b;\n}\n\nexport function multiply(a, b) {\n  return a * b;\n}\n\nexport function factorial(n) {\n  if (n <= 1) return 1;\n  return n * factorial(n - 1);\n}\n`,
  'src/utils/helpers.js': `export function log(msg) {\n  console.log(\`[\${new Date().toISOString()}] \${msg}\`);\n}\n\nexport function clamp(val, min, max) {\n  return Math.min(Math.max(val, min), max);\n}\n\nexport function generateId() {\n  return Math.random().toString(36).substring(2, 10);\n}\n`,
  'tests/math.test.js': `import { add, multiply, factorial } from '../src/math.js';\n\nconsole.log('Test add(2, 3):', add(2, 3) === 5 ? 'PASS' : 'FAIL');\nconsole.log('Test multiply(4, 5):', multiply(4, 5) === 20 ? 'PASS' : 'FAIL');\nconsole.log('Test factorial(5):', factorial(5) === 120 ? 'PASS' : 'FAIL');\nconsole.log('Test factorial(0):', factorial(0) === 1 ? 'PASS' : 'FAIL');\n`,
  'package.json': `{\n  "name": "securedev-project",\n  "version": "1.0.0",\n  "type": "module",\n  "main": "src/main.js",\n  "scripts": {\n    "start": "node src/main.js",\n    "test": "node tests/math.test.js"\n  }\n}\n`,
  'README.md': `# SecureDev Project\n\nProjet de développement dans l'environnement SecureDev OS.\n\n## Installation\n\n\`\`\`bash\nnpm install\n\`\`\`\n\n## Démarrage\n\n\`\`\`bash\nnpm start\n\`\`\`\n`
};

// --- Monaco Editor Setup ---
let editor = null;

require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' }});

require(['vs/editor/editor.main'], function() {
  // Définir le thème custom
  monaco.editor.defineTheme('securedev', {
    base: 'vs-dark',
    inherit: true,
    rules: [
      { token: 'comment', foreground: '3a5272', fontStyle: 'italic' },
      { token: 'keyword', foreground: 'c678dd' },
      { token: 'string', foreground: '98c379' },
      { token: 'number', foreground: 'd19a66' },
      { token: 'type', foreground: 'e5c07b' },
      { token: 'function', foreground: '61afef' },
      { token: 'variable', foreground: 'e06c75' },
      { token: 'operator', foreground: '56b6c2' },
      { token: 'delimiter', foreground: 'abb2bf' },
      { token: 'tag', foreground: 'e06c75' },
      { token: 'attribute.name', foreground: 'd19a66' },
      { token: 'attribute.value', foreground: '98c379' },
      { token: 'metatag', foreground: 'c678dd' },
    ],
    colors: {
      'editor.background': '#060c14',
      'editor.foreground': '#b8cce0',
      'editorLineNumber.foreground': '#1e3450',
      'editorLineNumber.activeForeground': '#3a5272',
      'editor.selectionBackground': '#00ff8820',
      'editor.lineHighlightBackground': '#0a1420',
      'editorCursor.foreground': '#00ff88',
      'editorIndentGuide.background': '#0e1a2c',
      'editorIndentGuide.activeBackground': '#14203a',
      'editor.selectionHighlightBackground': '#00ff8815',
      'editorBracketMatch.background': '#00ff8820',
      'editorBracketMatch.border': '#00ff8840',
      'scrollbarSlider.background': '#14203a80',
      'scrollbarSlider.hoverBackground': '#1e3450',
      'editorWidget.background': '#0c1422',
      'editorSuggestWidget.background': '#0c1422',
      'editorSuggestWidget.border': '#14203a',
      'editorSuggestWidget.selectedBackground': '#00ff8815',
      'input.background': '#060c16',
      'input.border': '#14203a',
    }
  });

  editor = monaco.editor.create(document.getElementById('monaco-container'), {
    theme: 'securedev',
    fontFamily: "'JetBrains Mono', monospace",
    fontSize: 13,
    lineHeight: 22,
    minimap: { enabled: false },
    scrollBeyondLastLine: false,
    smoothScrolling: true,
    cursorBlinking: 'smooth',
    cursorSmoothCaretAnimation: 'on',
    renderLineHighlight: 'all',
    bracketPairColorization: { enabled: true },
    padding: { top: 12 },
    automaticLayout: true,
    tabSize: 2,
    wordWrap: 'on',
    suggestOnTriggerCharacters: true,
    quickSuggestions: true,
  });

  // Sauvegarde automatique dans l'état
  editor.onDidChangeModelContent(() => {
    if (S.active && editor.getModel()) {
      S.files[S.active] = editor.getModel().getValue();
    }
  });

  // Raccourci Ctrl+S
  editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, () => {
    saveCurrentFile();
  });

  // Ouvrir le premier fichier
  openFile('src/main.js');
  renderTree();

  // Focus terminal
  document.getElementById('term-in').focus();
});

// --- Gestion des fichiers ---
function getLang(path) {
  const ext = path.split('.').pop();
  const map = { js:'javascript', ts:'typescript', jsx:'javascript', tsx:'typescript', py:'python', html:'html', css:'css', json:'json', md:'markdown', sh:'shell', yaml:'yaml', yml:'yaml', sql:'sql', xml:'xml' };
  return map[ext] || 'plaintext';
}

function openFile(path) {
  if (!S.files.hasOwnProperty(path)) return;
  
  if (!S.tabs.includes(path)) S.tabs.push(path);
  S.active = path;

  if (editor) {
    let model = S.models[path];
    if (!model) {
      model = monaco.editor.createModel(S.files[path], getLang(path));
      S.models[path] = model;
    }
    editor.setModel(model);
  }
  renderTabs();
  renderTree();
}

function closeTab(path, e) {
  if (e) e.stopPropagation();
  S.tabs = S.tabs.filter(t => t !== path);
  if (S.active === path) {
    S.active = S.tabs.length > 0 ? S.tabs[S.tabs.length - 1] : null;
    if (editor) editor.setModel(S.active ? (S.models[S.active] || null) : null);
  }
  renderTabs();
  renderTree();
}

function saveCurrentFile() {
  if (!S.active) return;
  if (editor && editor.getModel()) {
    S.files[S.active] = editor.getModel().getValue();
  }
  toast('Fichier sauvegardé: ' + S.active);
}

// --- Onglets ---
function renderTabs() {
  const c = document.getElementById('tabs');
  c.innerHTML = '';
  S.tabs.forEach(path => {
    const name = path.split('/').pop();
    const ext = name.split('.').pop();
    const colors = { js:'#f7df1e', ts:'#3178c6', py:'#3776ab', html:'#e34f26', css:'#1572b6', json:'#ffa500', md:'#888', sh:'#4eaa25' };
    const t = document.createElement('div');
    t.className = 'tab' + (path === S.active ? ' active' : '');
    t.innerHTML = `<span class="dot" style="background:${colors[ext]||'#555'}"></span>${name}<span class="close" onclick="closeTab('${path}',event)"><i class="fas fa-xmark"></i></span>`;
    t.onclick = () => openFile(path);
    c.appendChild(t);
  });
}

// --- Arbre de fichiers ---
function renderTree() {
  const c = document.getElementById('file-tree');
  c.innerHTML = '';
  const tree = buildTree(Object.keys(S.files).sort());
  tree.forEach(n => renderNode(c, n, 0));
}

function buildTree(paths) {
  const root = [];
  paths.forEach(p => {
    const parts = p.split('/');
    let current = root;
    parts.forEach((part, i) => {
      if (i === parts.length - 1) {
        current.push({ name: part, path: p, isDir: false });
      } else {
        let dir = current.find(c => c.isDir && c.name === part);
        if (!dir) { dir = { name: part, isDir: true, children: [] }; current.push(dir); }
        current = dir.children;
      }
    });
  });
  return root;
}

function renderNode(container, node, depth) {
  const el = document.createElement('div');
  if (node.isDir) {
    el.className = 'fi folder open';
    el.style.paddingLeft = (12 + depth * 14) + 'px';
    el.innerHTML = `<span class="fi-icon"><i class="fas fa-folder"></i></span>${node.name}/`;
    el.onclick = (e) => { e.stopPropagation(); el.classList.toggle('open'); };
    container.appendChild(el);
    const childC = document.createElement('div');
    childC.className = 'fi-children';
    node.children.sort((a,b) => (a.isDir?0:1) - (b.isDir?0:1) || a.name.localeCompare(b.name));
    node.children.forEach(c => renderNode(childC, c, depth + 1));
    el.appendChild(childC);
  } else {
    el.className = 'fi' + (node.path === S.active ? ' active' : '');
    el.style.paddingLeft = (12 + depth * 14) + 'px';
    const ext = node.name.split('.').pop();
    const icons = { js:'<i class="fab fa-js" style="color:#f7df1e"></i>', ts:'<i class="fas fa-code" style="color:#3178c6"></i>', py:'<i class="fab fa-python" style="color:#3776ab"></i>', html:'<i class="fab fa-html5" style="color:#e34f26"></i>', css:'<i class="fab fa-css3-alt" style="color:#1572b6"></i>', json:'<i class="fas fa-brackets-curly" style="color:#ffa500"></i>', md:'<i class="fab fa-markdown"></i>', sh:'<i class="fas fa-terminal" style="color:#4eaa25"></i>' };
    el.innerHTML = `<span class="fi-icon">${icons[ext]||'<i class="fas fa-file"></i>'}</span>${node.name}`;
    el.onclick = () => openFile(node.path);
    container.appendChild(el);
  }
}

// --- Terminal VRAI ---
const termIn = document.getElementById('term-in');
const termBody = document.getElementById('term-body');

termIn.addEventListener('keydown', e => {
  if (e.key === 'Enter') { execCmd(termIn.value.trim()); termIn.value = ''; }
  else if (e.key === 'ArrowUp') { e.preventDefault(); if (S.history.length) { S.histIdx = Math.min(S.histIdx + 1, S.history.length - 1); termIn.value = S.history[S.history.length - 1 - S.histIdx]; } }
  else if (e.key === 'ArrowDown') { e.preventDefault(); if (S.histIdx > 0) { S.histIdx--; termIn.value = S.history[S.history.length - 1 - S.histIdx]; } else { S.histIdx = -1; termIn.value = ''; } }
});

function tPrint(cls, text) {
  const d = document.createElement('div');
  d.className = 't-line ' + cls;
  d.textContent = text;
  termBody.appendChild(d);
  termBody.scrollTop = termBody.scrollHeight;
}

function tPrintHtml(html) {
  const d = document.createElement('div');
  d.className = 't-line';
  d.innerHTML = html;
  termBody.appendChild(d);
  termBody.scrollTop = termBody.scrollHeight;
}

function execCmd(raw) {
  if (!raw) return;
  S.history.push(raw); S.histIdx = -1;
  tPrintHtml(`<span class="t-prompt">~/project $</span> <span class="t-cmd">${esc(raw)}</span>`);

  const parts = raw.split(/\s+/);
  const cmd = parts[0];
  const args = parts.slice(1);
  const argStr = args.join(' ');

  switch(cmd) {
    case 'help':
      tPrint('out', 'ls, cat, touch, rm, echo, clear, pwd, node, eval');
      break;
    case 'ls': {
      const prefix = args[0] || '';
      Object.keys(S.files).filter(f => f.startsWith(prefix)).forEach(f => tPrint('out', f));
      break;
    }
    case 'cat':
      if (!args[0]) { tPrint('err', 'cat: fichier manquant'); break; }
      if (S.files.hasOwnProperty(args[0])) S.files[args[0]].split('\n').forEach(l => tPrint('out', l));
      else tPrint('err', `cat: ${args[0]}: introuvable`);
      break;
    case 'touch':
      if (!args[0]) { tPrint('err', 'touch: nom manquant'); break; }
      if (!S.files.hasOwnProperty(args[0])) { S.files[args[0]] = ''; renderTree(); tPrint('ok', 'Créé: ' + args[0]); }
      else tPrint('out', 'Existe déjà');
      break;
    case 'rm':
      if (!args[0]) { tPrint('err', 'rm: fichier manquant'); break; }
      if (S.files.hasOwnProperty(args[0])) {
        delete S.files[args[0]];
        if (S.models[args[0]]) { S.models[args[0]].dispose(); delete S.models[args[0]]; }
        if (S.tabs.includes(args[0])) closeTab(args[0]);
        renderTree(); tPrint('ok', 'Supprimé: ' + args[0]);
      } else tPrint('err', 'rm: introuvable');
      break;
    case 'echo':
      tPrint('out', argStr);
      break;
    case 'clear':
      termBody.innerHTML = '';
      break;
    case 'pwd':
      tPrint('out', '/home/sandbox/project');
      break;
    case 'node':
    case 'eval': {
      const code = argStr || (args[0] && S.files[args[0]] ? S.files[args[0]] : null);
      if (!code) { tPrint('err', 'Usage: node <code> ou node <fichier>'); break; }
      const logs = [];
      const fakeConsole = { log: (...a) => logs.push(a.map(String).join(' ')), error: (...a) => logs.push('ERR: ' + a.map(String).join(' ')), warn: (...a) => logs.push('WARN: ' + a.map(String).join(' ')) };
      try {
        const fn = new Function('console', 'require', code);
        const fakeRequire = (mod) => { if(mod.startsWith('.')) { const p = mod.replace(/^\.\//,''); return S.files[p] || {}; } return {}; };
        fn(fakeConsole, fakeRequire);
        logs.forEach(l => tPrint('out', l));
        if (!logs.length) tPrint('ok', '(exécuté sans sortie)');
      } catch(e) {
        tPrint('err', e.message);
      }
      break;
    }
    default:
      tPrint('err', `${cmd}: commande inconnue. Tapez 'help'.`);
  }
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// --- Agent IA LOCAL (fonctionnel) ---
let agTool = null;
function setTool(btn) {

  if (agTool === btn.dataset.t) { agTool = null; return; }

function agMsg(type, text) {

function sendAg() {
  const input = document.getElementById('ag-in');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';
  agMsg('user', text);

  setTimeout(() => {
    const code = S.active ? (S.files[S.active] || '') : '';
    const fname = S.active || 'aucun fichier';
    const tool = agTool;
    agTool = null;
    document.querySelectorAll('.ag-tool').forEach(b => b.classList.remove('active'));

    if (tool === 'gen' || (!tool && (text.toLowerCase().includes('créer') || text.toLowerCase().includes('cree') || text.toLowerCase().includes('génér') || text.toLowerCase().includes('ajout') || text.toLowerCase().includes('écri') || text.toLowerCase().includes('add function')))) {
      handleGenerate(text, code, fname);
    } else if (tool === 'fix' || (!tool && (text.toLowerCase().includes('corriger') || text.toLowerCase().includes('fix') || text.toLowerCase().includes('bug') || text.toLowerCase().includes('erreur')))) {
      handleFix(text, code, fname);
    } else if (tool === 'review' || (!tool && text.toLowerCase().includes('review') || text.toLowerCase().includes('analyser') || text.toLowerCase().includes('analyse'))) {
      handleReview(text, code, fname);
    } else if (tool === 'explain' || (!tool && text.toLowerCase().includes('expliqu'))) {
      handleExplain(text, code, fname);
    } else if (tool === 'test' || (!tool && text.toLowerCase().includes('test'))) {
      handleTest(text, code, fname);
    } else if (tool === 'refactor' || (!tool && text.toLowerCase().includes('refactor'))) {
      handleRefactor(text, code, fname);
    } else {
      handleGeneric(text, code, fname);
    }
  }, 300);
}

function handleGenerate(text, code, fname) {
  agToolTrace('Analyse de la demande: "' + text.substring(0, 50) + '..."');
  agToolTrace('Détection du langage: ' + getLang(fname));
  
  let generated = '';
  const lower = text.toLowerCase();
  
  if (lower.includes('fibonacci')) {
    generated = `\n// Généré par l'agent\nexport function fibonacci(n) {\n  if (n <= 1) return n;\n  let a = 0, b = 1;\n  for (let i = 2; i <= n; i++) {\n    [a, b] = [b, a + b];\n  }\n  return b;\n}\n`;
  } else if (lower.includes('fetch') || lower.includes('api') || lower.includes('http') || lower.includes('requête')) {
    generated = `\n// Généré par l'agent\nexport async function fetchAPI(url, options = {}) {\n  try {\n    const response = await fetch(url, {\n      headers: { 'Content-Type': 'application/json', ...options.headers },\n      ...options\n    });\n    if (!response.ok) throw new Error(\`HTTP \${response.status}\`);\n    return await response.json();\n  } catch (error) {\n    console.error('Erreur fetchAPI:', error);\n    throw error;\n  }\n}\n`;
  } else if (lower.includes('debounce')) {
    generated = `\n// Généré par l'agent\nexport function debounce(fn, delay = 300) {\n  let timer;\n  return function(...args) {\n    clearTimeout(timer);\n    timer = setTimeout(() => fn.apply(this, args), delay);\n  };\n}\n`;
  } else if (lower.includes('class') || lower.includes('classe')) {
    generated = `\n// Généré par l'agent\nexport class Model {\n  constructor(data = {}) {\n    this.id = data.id || null;\n    this.createdAt = new Date();\n    this.updatedAt = new Date();\n    Object.assign(this, data);\n  }\n\n  update(data) {\n    Object.assign(this, data);\n    this.updatedAt = new Date();\n  }\n\n  toJSON() {\n    return { ...this };\n  }\n}\n`;
  } else {
    // Générique
    const fnameMatch = text.match(/(?:fonction|function)\s+(\w+)/i);
    const funcName = fnameMatch ? fnameMatch[1] : 'newFunction';
    generated = `\n// Généré par l'agent\nexport function ${funcName}() {\n  // Implémentation\n  console.log('${funcName} appelé');\n}\n`;
  }

  if (S.active && editor) {
    const model = editor.getModel();
    const newCode = code + generated;
    S.files[S.active] = newCode;
    model.setValue(newCode);
    agToolTrace('Code injecté dans ' + fname + ' (+' + generated.split('\n').length + ' lignes)');
    agMsg('bot', `Fonction générée et ajoutée à ${fname}.\n\n${generated.trim()}`);
  } else {
    agMsg('bot', 'Ouvrez un fichier d\'abord pour que je puisse y injecter le code.');
  }
}

function handleFix(text, code, fname) {
  agToolTrace('Analyse statique de ' + fname);
  const lines = code.split('\n');
  const issues = [];
  
  // Vérifier les parenthèses/brackets non fermés
  let parens = 0, brackets = 0, braces = 0;
  lines.forEach((line, i) => {
    for (const ch of line) {
      if (ch === '(') parens++;
      if (ch === ')') parens--;
      if (ch === '[') brackets++;
      if (ch === ']') brackets--;
      if (ch === '{') braces++;
      if (ch === '}') braces--;
    }
    if (parens < 0) issues.push(`Ligne ${i+1}: parenthèse fermante sans ouvrante`);
    if (brackets < 0) issues.push(`Ligne ${i+1}: crochet fermant sans ouvrant`);
    if (braces < 0) issues.push(`Ligne ${i+1}: accolade fermante sans ouvrante`);
  });
  if (parens > 0) issues.push(`${parens} parenthèse(s) non fermée(s)`);
  if (brackets > 0) issues.push(`${brackets} crochet(s) non fermé(s)`);
  if (braces > 0) issues.push(`${braces} accolade(s) non fermée(s)`);

  // Checker les fonctions vides
  const emptyFuncRegex = /function\s+\w+\s*\([^)]*\)\s*\{\s*\}/g;
  let match;
  while ((match = emptyFuncRegex.exec(code)) !== null) {
    const lineNum = code.substring(0, match.index).split('\n').length;
    issues.push(`Ligne ${lineNum}: fonction vide détectée`);
  }

  if (issues.length === 0) {
    agToolTrace('0 problème trouvé');
    agMsg('bot', `Aucun problème syntaxique détecté dans ${fname}.\n\n${lines.length} lignes analysées.\nParenthèses, crochets, accolages: équilibrés.\nFonctions vides: aucune.`);
  } else {
    agToolTrace(`${issues.length} problème(s) trouvé(s)`);
    let fixed = false;
    // Tenter de corriger les brackets déséquilibrés
    if (braces > 0 && S.active && editor) {
      const newCode = code + '\n}'.repeat(braces);
      S.files[S.active] = newCode;
      editor.getModel().setValue(newCode);
      agToolTrace(`Correction: ${braces} accolade(s) ajoutée(s) en fin de fichier`);
      fixed = true;
    }
    agMsg('bot', `Problèmes trouvés dans ${fname}:\n\n${issues.map(i => '• ' + i).join('\n')}${fixed ? '\n\nCorrection automatique appliquée.' : '\n\nCorrection manuelle requise.'}`);
  }
}

function handleReview(text, code, fname) {
  agToolTrace('Review de ' + fname);
  const lines = code.split('\n');
  const funcs = code.match(/(?:function\s+(\w+)|(?:const|let|var)\s+(\w+)\s*=\s*(?:async\s+)?\([^)]*\)\s*=>)/g) || [];
  const comments = (code.match(/\/\/.*/g) || []).length;
  const imports = (code.match(/^import .+$/gm) || []).length;
  const exports = (code.match(/^export .+$/gm) || []).length;
  const emptyLines = lines.filter(l => l.trim() === '').length;
  
  agToolTrace(`Métriques: ${lines.length}L, ${funcs.length} fonctions, ${comments} commentaires, ${imports} imports, ${exports} exports`);
  
  let score = 10;
  const notes = [];
  if (comments < 1 && lines.length > 5) { score -= 2; notes.push('Manque de commentaires'); }
  if (emptyLines > lines.length * 0.4) { score -= 1; notes.push('Trop de lignes vides'); }
  if (funcs.length === 0 && lines.length > 3) { score -= 2; notes.push('Aucune fonction définie'); }
  if (code.includes('var ')) { score -= 1; notes.push('Utilisation de var (préférer const/let)'); }
  if (code.includes('console.log') && !fname.includes('test')) { score -= 1; notes.push('console.log présent dans le code principal'); }
  if (imports > 0 && exports === 0) { notes.push('Imports sans export — module possibly unused'); }
  if (notes.length === 0) notes.push('Code propre et bien structuré');

  agMsg('bot', `Review de ${fname}:\n\nLignes: ${lines.length} | Fonctions: ${funcs.length} | Commentaires: ${comments}\nImports: ${imports} | Exports: ${exports}\n\nNote: ${score}/10\n\n${notes.map(n => '• ' + n).join('\n')}`);
}

function handleExplain(text, code, fname) {
  agToolTrace('Analyse de ' + fname);
  if (!code.trim()) { agMsg('bot', 'Le fichier est vide.'); return; }
  
  const lines = code.split('\n');
  const funcs = [];
  const importRegex = /^import\s+(?:\{([^}]+)\}|(\w+))\s+from\s+['"](.+)['"]/gm;
  let m;
  const imports = [];
  while ((m = importRegex.exec(code)) !== null) imports.push({ names: m[1] || m[2], from: m[3] });
  
  const funcRegex = /(?:export\s+)?(?:function\s+(\w+)\s*\(([^)]*)\)|(?:const|let)\s+(\w+)\s*=\s*(?:async\s+)?\(([^)]*)\)\s*=>)/g;
  while ((m = funcRegex.exec(code)) !== null) {
    funcs.push({ name: m[1] || m[3], params: (m[2] || m[4] || '').split(',').map(p=>p.trim()).filter(Boolean) });
  }

  let explanation = `Fichier: ${fname}\nLangage: ${getLang(fname)}\nLignes: ${lines.length}\n\n`;
  if (imports.length) {
    explanation += 'Dépendances:\n';
    imports.forEach(i => explanation += `  • ${i.names} ← ${i.from}\n`);
    explanation += '\n';
  }
  if (funcs.length) {
    explanation += 'Fonctions:\n';
    funcs.forEach(f => explanation += `  • ${f.name}(${f.params.join(', ') || 'void'})\n`);
    explanation += '\n';
  }
  explanation += 'Le code ' + (exports > 0 ? 'exporte des modules et ' : '') + (funcs.length > 0 ? `définit ${funcs.length} fonction(s).` : 'ne contient pas de fonction nommée.');
  
  agMsg('bot', explanation);
}

function handleTest(text, code, fname) {
  agToolTrace('Exécution des tests en mémoire');
  const logs = [];
  const fakeC = { log: (...a) => logs.push(a.join(' ')), error: (...a) => logs.push('ERR: '+a.join(' ')) };
  
  // Chercher les fichiers de test
  const testFiles = Object.keys(S.files).filter(f => f.includes('.test.') || f.includes('.spec.'));
  
  if (testFiles.length === 0) {
    agMsg('bot', 'Aucun fichier de test trouvé (.test.js ou .spec.js).\n\nCréez-en un avec le bouton + ou "touch tests/main.test.js" dans le terminal.');
    return;
  }

  let allPassed = true;
  let totalTests = 0;
  
  testFiles.forEach(tf => {
    agToolTrace('Exécution: ' + tf);
    try {
      const testCode = S.files[tf];
      const fn = new Function('console', 'require', testCode);
      const fakeReq = (mod) => { const p = mod.replace(/^\.\//,'').replace(/^\.\.\//,'src/'); return S.files[p] || {}; };
      fn(fakeC, fakeReq);
      logs.forEach(l => {
        if (l.includes('PASS')) totalTests++;
        if (l.includes('FAIL')) { totalTests++; allPassed = false; }
      });
    } catch(e) {
      logs.push('ERR: ' + e.message);
      allPassed = false;
    }
  });

  agMsg('bot', `Résultats des tests:\n\n${logs.join('\n')}\n\n${allPassed ? '✓ Tous les tests passent' : '✗ Certains tests échouent'} (${totalTests} exécutés)`);
}

function handleRefactor(text, code, fname) {
  if (!code.trim()) { agMsg('bot', 'Fichier vide.'); return; }
  agToolTrace('Refactoring: ' + fname);
  
  let newCode = code;
  let changes = [];
  
  // var -> const/let
  if (/\bvar\s+/.test(newCode)) {
    newCode = newCode.replace(/\bvar\s+/g, 'const ');
    changes.push('var → const');
  }
  
  // == -> ===
  if (/[^=!]==[^=]/.test(newCode)) {
    newCode = newCode.replace(/([^=!])==([^=])/g, '$1===$2');
    changes.push('== → ===');
  }
  
  // != -> !==
  if (/[^!]!=[^=]/.test(newCode)) {
    newCode = newCode.replace(/([^!])!=([^=])/g, '$1!==$2');
    changes.push('!= → !==');
  }

  if (changes.length === 0) {
    agToolTrace('Aucune refactorisation nécessaire');
    agMsg('bot', 'Le code est déjà propre. Aucune refactorisation automatique appliquée.');
  } else {
    S.files[S.active] = newCode;
    if (editor) editor.getModel().setValue(newCode);
    agToolTrace(changes.length + ' modification(s) appliquée(s)');
    agMsg('bot', `Refactorisations appliquées à ${fname}:\n\n${changes.map(c => '• ' + c).join('\n')}`);
  }
}

function handleGeneric(text, code, fname) {
  const lower = text.toLowerCase();
  if (lower.includes('salut') || lower.includes('bonjour') || lower.includes('hello')) {
    agMsg('bot', `Bonjour. Fichier actif: ${fname}\n${code ? code.split('\n').length + ' lignes dans l\'éditeur.' : 'Aucun fichier ouvert.'}\n\nJe peux générer du code, corriger des bugs, expliquer, review, tester ou refactorer. Sélectionnez un outil ou décrivez votre besoin.`);
  } else if (lower.includes('supprim') || lower.includes('effac')) {
    if (S.active) {
      const p = S.active;
      delete S.files[p];
      if (S.models[p]) { S.models[p].dispose(); delete S.models[p]; }
      closeTab(p);
      renderTree();
      agToolTrace('Fichier supprimé: ' + p);
      agMsg('bot', `Fichier ${p} supprimé.`);
    } else agMsg('bot', 'Aucun fichier actif.');
  } else if (lower.includes('ouvr') || lower.includes('va dans') || lower.includes('affich')) {
    const match = Object.keys(S.files).find(f => lower.includes(f.split('/').pop().toLowerCase()));
    if (match) { openFile(match); agToolTrace('Navigation: ' + match); agMsg('bot', 'Ouvert: ' + match); }
    else agMsg('bot', 'Fichier non trouvé. Fichiers disponibles:\n' + Object.keys(S.files).join('\n'));
  } else {
    agMsg('bot', `Commande non reconnue. Fichier actif: ${fname}\n\nOutils disponibles:\n• Générer — créer du code\n• Corriger — réparer les bugs\n• Review — analyser la qualité\n• Expliquer — comprendre le code\n• Tester — exécuter les tests\n• Refactor — améliorer le style\n\nOu décrivez précisément ce que vous voulez faire.`);
  }
}

// --- Agent input ---
const agIn = document.getElementById('ag-in');
agIn.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendAg(); }
});
agIn.addEventListener('input', () => { agIn.style.height = 'auto'; agIn.style.height = Math.min(agIn.scrollHeight, 100) + 'px'; });

// --- Toast ---
function toast(msg, isErr) {
  const c = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast' + (isErr ? ' err' : '');
  t.innerHTML = `<i class="fas fa-${isErr ? 'circle-exclamation' : 'check-circle'}"></i>${msg}`;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(() => t.remove(), 300); }, 2500);
}

// --- Raccourcis clavier globaux ---
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveCurrentFile(); }
  if (e.key === 'Escape') hideModal();
});
